<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Campus Angle</title>
<meta name="description" content="KHS Cougar News micro-lesson: turn a topic or big story into a campus story.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red-dk:#6F1A1D; --red:#B3201F; --red-br:#DD2A2A; --ink:#1E1E21; --ink2:#4A4A50;
  --line:#E6DCDA; --tint:#FBEFEE; --sand:#F6F2F0; --link:#1A5FB4; --ok:#1d7a3a; --ok-bg:#E8F4EC;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Lexend,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:17px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

/* header band, after switcher.png */
.band{background:linear-gradient(180deg,var(--red-dk) 0%,#A61E1E 55%,var(--red-br) 100%);color:#fff;padding:22px 16px 18px}
.band-in{max-width:760px;margin:0 auto;position:relative}
.kicker{font-family:Montserrat;font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.88;padding-right:150px}
.band h1{font-family:Montserrat;font-weight:900;font-size:clamp(28px,7vw,44px);line-height:1.02;text-transform:uppercase;margin-top:6px;text-shadow:2px 2px 0 rgba(60,20,20,.55)}
.band .sub{font-weight:300;font-size:16px;margin-top:6px;opacity:.95}
.chip{position:absolute;top:-2px;right:0;background:#fff;color:var(--red-dk);font-family:Montserrat;font-weight:800;font-size:10px;letter-spacing:.14em;padding:4px 9px;border-radius:3px}

/* progress */
.prog{background:var(--ink);color:#fff;padding:10px 16px}
.prog-in{max-width:760px;margin:0 auto;display:flex;gap:6px;align-items:center}
.prog .seg{flex:1;height:6px;border-radius:3px;background:#46464c}
.prog .seg.done{background:var(--red-br)}
.prog .seg.now{background:#fff}
.prog .lbl{font-family:Montserrat;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;margin-left:8px;opacity:.85}

main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:24px 16px 32px}
h2{font-family:Montserrat;font-weight:800;font-size:20px;color:var(--red-dk);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:10px;margin-bottom:12px}
h2 .n{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;letter-spacing:0;flex:none}
h3{font-family:Montserrat;font-weight:800;font-size:16px;margin-bottom:4px}
p+p{margin-top:10px}
.lead{font-size:18px}
b{font-weight:600}
.muted{color:var(--ink2);font-size:15px}

.box{background:var(--sand);border-radius:8px;padding:14px 16px}
.callout{background:var(--tint);border-left:5px solid var(--red);border-radius:0 8px 8px 0;padding:12px 16px;margin:16px 0}
.tag{font-family:Montserrat;font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--red-dk);text-transform:uppercase;display:block;margin-bottom:2px}
.stack>*+*{margin-top:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:8px;border:0;background:var(--red);color:#fff;font-family:Montserrat;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{background:var(--red-dk)}
.btn[disabled]{background:#c9c3c1;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--red-dk);border:2px solid var(--red)}
.btn.ghost:hover{background:var(--tint)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.nav .spacer{flex:1}
.say-btn{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.say-btn:hover{border-color:var(--red);color:var(--red-dk)}

/* value cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vcard{text-align:left;background:var(--sand);border:2px solid transparent;border-radius:10px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.vcard:hover{border-color:var(--line)}
.vcard .easy{font-family:Montserrat;font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--red)}
.vcard .nm{font-family:Montserrat;font-weight:800;font-size:18px}
.vcard .hint{font-size:13px;color:var(--ink2);margin-top:auto}
.vcard .more{display:none;font-size:15px}
.vcard.open{background:#fff;border-color:var(--red)}
.vcard.open .more{display:block}
.vcard.open .hint{display:none}
.vcard .ex{color:var(--ink2);font-size:14px;margin-top:4px}
.count{font-family:Montserrat;font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase;margin:14px 0 0}

/* question */
.q{background:var(--sand);border-radius:10px;padding:18px 18px 16px}
.q .qn{font-family:Montserrat;font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.q .stem{font-size:19px;font-weight:600;margin:6px 0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px;font-size:15px}
.opt .e{display:block;font-family:Montserrat;font-weight:900;font-size:11px;letter-spacing:.12em;color:var(--red)}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--tint)}
.opt.dim{opacity:.55}
.opt.pitch{font-size:16px;padding:14px}
.opt.pitch b{font-family:Montserrat;font-weight:800;color:var(--red-dk);margin-right:6px}
.fb{margin-top:14px;border-radius:8px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.no{background:var(--tint);border-left:5px solid var(--red)}
.fb .v{font-family:Montserrat;font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
.fb.ok .v{color:var(--ok)} .fb.no .v{color:var(--red)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-family:Montserrat;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--red);color:#fff}
.pill.ink{background:var(--ink)}

/* your turn */
label.fld{display:block;font-weight:600;margin-bottom:6px}
.inp{width:100%;border:2px solid var(--line);border-radius:8px;padding:12px;font-size:16px;background:#fff}
.inp:focus{border-color:var(--red);outline:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px 12px;min-height:48px;cursor:pointer;font-size:15px}
.ck input{width:20px;height:20px;accent-color:var(--red);flex:none}
.ck:has(input:checked){border-color:var(--red);background:var(--tint)}
.meter{margin-top:14px;border-radius:8px;padding:12px 14px;background:var(--sand)}
.meter.go{background:var(--ok-bg);border-left:5px solid var(--ok)}
.meter.wait{border-left:5px solid #b9b2b0}
.pitchline{font-size:16px;background:#fff;border:2px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap}

/* words to know */
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:Montserrat;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-dk);text-align:left;padding:8px;border-bottom:2px solid var(--red)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.k{font-family:Montserrat;font-weight:800;white-space:nowrap}
td input{width:100%;min-width:90px;border:0;border-bottom:1.5px solid #9a9a9a;padding:4px 2px;font-size:15px;background:transparent}
details{margin-top:18px}
summary{font-family:Montserrat;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dk);cursor:pointer;padding:6px 0;min-height:40px;display:flex;align-items:center}

.walk{display:grid;gap:8px}
.wk{text-align:left;width:100%;align-items:flex-start}
.wk .box2{width:22px;height:22px;border:2px solid var(--red);border-radius:4px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;margin-top:2px}
.wk.on{border-color:var(--red);background:var(--tint)}
.wk.on .box2{background:var(--red)}
.wk.right{border-color:var(--ok);background:var(--ok-bg)}
.wk.wrong{border-color:var(--red);background:var(--tint)}
.wk .why{display:block;font-size:14px;color:var(--ink2);margin-top:4px}
.wk[disabled]{cursor:default}
.write{border-bottom:1.5px solid #9a9a9a;padding:0 4px;font-weight:600}

.cols2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.stepf{display:flex;gap:12px;align-items:flex-start}
.stepf>div{flex:1;min-width:0}
.stepf .sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-family:Montserrat;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.stepf .fld{display:block;font-weight:600;margin-bottom:6px}
.frame{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.frame .inp{flex:1 1 180px;width:auto}
.frame span{font-weight:600;color:var(--red-dk)}
@media (max-width:480px){.cols2{grid-template-columns:1fr}}

/* done */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:Montserrat;font-weight:900;font-size:56px;color:var(--red);line-height:1}
.dark{background:var(--ink);color:#fff;border-radius:10px;padding:18px}
.dark .tag{color:#ff8d8d}
.dark .who{font-family:Montserrat;font-weight:800;font-size:22px;margin-top:4px}
.dark .row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #3a3a40;padding-top:8px;margin-top:8px;font-size:15px}

.passwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.pass-img{width:100%;max-width:340px;display:block;filter:drop-shadow(0 8px 18px rgba(30,30,33,.25))}
.passwrap .btn{width:100%;max-width:340px}

footer{background:var(--ink);color:#fff;padding:12px 16px;font-family:Montserrat;font-size:11px;font-weight:600;letter-spacing:.06em}
footer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
footer .num{font-weight:900;font-size:22px;color:var(--red-br);line-height:1}
footer .doc{flex:1;text-transform:uppercase}

@media (max-width:480px){
  .opts.two{grid-template-columns:1fr}
  .nav .btn{flex:1}
  .nav .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.prog,.nav,.say-btn{display:none!important}}
</style>
</head>
<body>

<header class="band">
  <div class="band-in">
    <div class="kicker">KHS Cougar News · 01 Bullpen &amp; Planning</div>
    <span class="chip">MICRO-LESSON 03</span>
    <h1>Find the Campus Angle</h1>
    <div class="sub">Topic to story in 5 steps</div>
  </div>
</header>

<nav class="prog" aria-label="Progress">
  <div class="prog-in" id="prog"></div>
</nav>

<main id="app" tabindex="-1"></main>

<footer>
  <div class="in"><span class="num">01</span><span class="doc">Based on Finding Stories – Handout</span><span>~9 min</span></div>
</footer>

<script>
(function(){
"use strict";

/* ---------- content (from Finding Stories – Handout: 1 Topic or story?, 3 Big news campus angle, 4 From topic to story; Story Pitch – Template) ---------- */

/* Practice 1: topic or story? Made-up examples. */
const SORT = [
  {s:"Cell phones", story:false, why:"A big subject. No person, no action."},
  {s:"Seniors start a petition Monday to bring back the off-campus lunch pass.", story:true, why:"A person (seniors) and an action (start a petition), happening now."},
  {s:"Stress before finals", story:false, why:"Still a topic. Who is doing what? Find the person and the action."},
  {s:"The tennis team practices at a city park for 3 weeks while its courts are resurfaced.", story:true, why:"A group, an action, and a reason it's happening now."},
  {s:"School spirit", story:false, why:"A big subject. You can't film \"school spirit.\" You can film people doing something."},
  {s:"Counselors add walk-in hours during finals week.", story:true, why:"A person (counselors), an action (add hours), and a time (finals week)."},
  {s:"Sports injuries", story:false, why:"A topic. Narrow it: which team, which change, this week?"},
  {s:"The art club paints a mural in the B hall this week.", story:true, why:"A group, an action you can film, and it's this week."}
];

/* Practice 2: narrow it. Pick the right size. */
const NARROW = [
  {topic:"Lunch", opts:[
    {t:"School lunch is important to students.", r:"topic", why:"Still a topic. No person, no action, nothing new."},
    {t:"Lunches across Texas are changing.", r:"big", why:"Too big. You can't get 5 shots of all of Texas this week."},
    {t:"The cafeteria adds a salad bar Monday, and the line moves to the gym hallway.", r:"ok", why:"Right size. A person, an action, this week, and you can film it."}]},
  {topic:"Clubs", opts:[
    {t:"The new esports club fills all 40 spots on day one and starts a waitlist.", r:"ok", why:"Right size. Something new happened, and it's a first."},
    {t:"Why every student should join a club.", r:"promo", why:"This promotes. It doesn't report. Our stories report what is happening."},
    {t:"Clubs are a big part of high school.", r:"topic", why:"Still a topic. Who is doing what?"}]},
  {topic:"Weather", opts:[
    {t:"Hurricane season affects the whole Gulf Coast.", r:"big", why:"Too big. Find the person here it touches."},
    {t:"After Friday's storm, the softball field floods and two home games move to another school.", r:"ok", why:"Right size. Timely, it changes things for a team, and you can film the field."},
    {t:"Bad weather can be scary.", r:"topic", why:"Still a topic. Nothing is happening to anyone yet."}]},
  {topic:"Technology", opts:[
    {t:"Students use their phones a lot.", r:"topic", why:"Still a topic. Everyone knows. What is new?"},
    {t:"Technology is changing schools everywhere.", r:"big", why:"Too big. Narrow it to here, this week."},
    {t:"Starting Tuesday, the library lends out 30 new hotspots to students without home Wi-Fi.", r:"ok", why:"Right size. It starts Tuesday, and it helps students you can interview."}]}
];

/* Practice 3: bring it here. One person it affects + one person who can explain. */
const BRING = [
  {big:"Gas prices rise across the Houston area.",
   aff:{q:"Who here does it affect?", opts:["A senior who drives 20 minutes to school and pays for her own gas","A reporter at a Houston TV station","A freshman who rides the bus"], a:0,
        why:"She lives it. She is here, and the change costs her money every week."},
   exp:{q:"Who can explain it?", opts:["The cafeteria manager","An economics teacher","A student who drives"], a:1,
        why:"An economics teacher can explain why prices go up. That's your facts interview."}},
  {big:"A shortage of school bus drivers hits districts across the state.",
   aff:{q:"Who here does it affect?", opts:["A student who drives his own car","A bus company in another state","A student whose bus route was combined and now gets to school 20 minutes late"], a:2,
        why:"His mornings changed. That's the person it touches."},
   exp:{q:"Who can explain it?", opts:["The district transportation director","A parent on social media","A bus rider"], a:0,
        why:"The transportation director knows the facts: how many routes, how many drivers, what's next."}},
  {big:"The city closes its public pool all summer for repairs.",
   aff:{q:"Who here does it affect?", opts:["A teacher who doesn't swim","A junior lifeguard who now needs a new summer job","A swimmer in another city"], a:1,
        why:"Her summer plans changed. Real people make big news matter."},
   exp:{q:"Who can explain it?", opts:["A city parks official","The junior lifeguard","A student who heard about it"], a:0,
        why:"The city official knows why it closed and for how long."}}
];

const WORDS = [
  ["topic","A big subject, like \"parking.\""],
  ["story","Something happening to someone now."],
  ["focus sentence","One sentence: who is doing what, and why students care now."],
  ["angle","What makes our story different."],
  ["narrow","Make the idea smaller and more specific."]
];

/* ---------- state ---------- */
const STEPS = ["Start","Topic or story?","Narrow it","Bring it here","Build it","Done"];
const S = {step:0, sIdx:0, sAns:[], nIdx:0, nAns:[], bIdx:0, bAff:[], bExp:[], mine:{topic:"",news:"",aff:"",exp:"",who:"",what:"",why:"",shots:["","","","",""]}, name:""};
const KEY = "khscn-ml-03";
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)||"{}"); if(d.lang) S.lang=d.lang; if(d.name) S.name=d.name;
  if(!S.name){ for(const k of ["khscn-ml-02","khscn-ml-01"]){ const o=JSON.parse(localStorage.getItem(k)||"{}"); if(o.name){S.name=o.name;break;} } } }catch(e){} S.lang=S.lang||{}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({lang:S.lang,name:S.name})); }catch(e){} }
load();

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canSpeak = "speechSynthesis" in window;
function speak(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.92; speechSynthesis.speak(u);}catch(e){} }
const sayBtn = t => canSpeak ? `<button class="say-btn" data-say="${esc(t)}" aria-label="Listen"><span aria-hidden="true">🔊</span> Listen</button>` : "";
function go(n){ if(canSpeak) speechSynthesis.cancel(); S.step=n; render(); window.scrollTo({top:0}); app.focus({preventScroll:true}); }
function renderProg(){
  document.getElementById("prog").innerHTML =
    STEPS.map((_,i)=>`<span class="seg ${i<S.step?"done":i===S.step?"now":""}"></span>`).join("") +
    `<span class="lbl">${S.step+1}/${STEPS.length} · ${esc(STEPS[S.step])}</span>`;
}
const RLABEL = {topic:"Still a topic", big:"Too big", promo:"Promotes", ok:"Right size"};

/* ---------- screens ---------- */
const screens = [
/* 0 start */
() => `
  <div class="stack">
    <h2><span class="n">1</span>Topic or story?</h2>
    <p class="lead">A <b>topic</b> is a big subject. A <b>story</b> is something happening to someone now. ${sayBtn("A topic is a big subject. A story is something happening to someone now.")}</p>
    <div class="cols2">
      <div class="box"><span class="tag">Topic</span>Parking</div>
      <div class="box"><span class="tag">Story</span>Construction closes the back lot Monday, so students with permits have to find new spots.</div>
    </div>
    <div class="callout"><span class="tag">The test</span>
      Can you say it in <b>one sentence with a person and an action</b> in it? If not, you still have a topic. Make it smaller. ${sayBtn("The test. Can you say it in one sentence with a person and an action in it? If not, you still have a topic. Make it smaller.")}
    </div>
    <p>A 30–60 second news story has room for one point, one strong voice and a few shots. Keep the idea small and specific.</p>
    <table>
      <thead><tr><th>Too big</th><th>Right size</th></tr></thead>
      <tbody>
        <tr><td class="k">Homecoming</td><td>Student council sells out of tickets two days early and starts a waitlist.</td></tr>
        <tr><td class="k">Band</td><td>The drumline moves practice to 6 a.m. to share the field with football.</td></tr>
        <tr><td class="k">School lunch</td><td>The cafeteria adds a grab-and-go line, and the wait drops by half.</td></tr>
      </tbody>
    </table>
    <details>
      <summary>Words to know</summary>
      <table>
        <thead><tr><th>Word</th><th>What it means</th><th>In my language</th></tr></thead>
        <tbody>${WORDS.map(([w,m],i)=>`<tr><td class="k">${esc(w)}</td><td>${esc(m)}</td><td><input data-lang="${i}" aria-label="${esc(w)} in my language" value="${esc(S.lang[i]||"")}"></td></tr>`).join("")}</tbody>
      </table>
    </details>
  </div>
  <div class="nav"><span class="spacer"></span><button class="btn" data-go="1">Start</button></div>`,

/* 1 sort */
() => {
  const i=S.sIdx, q=SORT[i], ans=S.sAns[i];
  return `
  <h2><span class="n">2</span>Topic or story?</h2>
  <p>Use the test: one sentence, a person, an action.</p>
  <div class="q" style="margin-top:14px">
    <div class="qn">${i+1} of ${SORT.length}</div>
    <p class="stem">"${esc(q.s)}" ${sayBtn(q.s)}</p>
    <div class="opts two">
      ${[[false,"Topic","Big subject"],[true,"Story","Person + action, now"]].map(([val,l,sub])=>{
        let c=""; if(ans!==undefined){ c = val===q.story?"right":(val===ans?"wrong":"dim"); }
        return `<button class="opt ${c}" data-sort="${val}" ${ans!==undefined?"disabled":""}><span class="e">${sub}</span>${l}</button>`;}).join("")}
    </div>
    <div class="fb ${ans!==undefined?(ans===q.story?"ok show":"no show"):""}" aria-live="polite">
      ${ans!==undefined?`<span class="v">${ans===q.story?"Right.":"Look again. It's a "+(q.story?"story":"topic")+"."}</span>${esc(q.why)}`:""}
    </div>
  </div>
  <div class="nav"><button class="btn ghost" data-go="0">Back</button><span class="spacer"></span>
    ${ans!==undefined?`<button class="btn" data-next="sort">${i<SORT.length-1?"Next":"Next step"}</button>`:""}</div>`;
},

/* 2 narrow */
() => {
  const i=S.nIdx, q=NARROW[i], ans=S.nAns[i];
  return `
  <h2><span class="n">3</span>Narrow it</h2>
  <p>A reporter pitched a topic. Which version is the <b>right size</b> for a :30–:60 story?</p>
  <div class="q" style="margin-top:14px">
    <div class="qn">Topic ${i+1} of ${NARROW.length}</div>
    <p class="stem">Topic: ${esc(q.topic)}</p>
    <div class="opts one">${q.opts.map((o,j)=>{
      let c=""; if(ans!==undefined){ c = o.r==="ok"?"right":(j===ans?"wrong":"dim"); }
      return `<button class="opt pitch ${c}" data-narrow="${j}" ${ans!==undefined?"disabled":""}>${ans!==undefined?`<span class="e">${RLABEL[o.r]}</span>`:""}${esc(o.t)}</button>`;}).join("")}
    </div>
    ${ans!==undefined?`<div class="fb show ${q.opts[ans].r==="ok"?"ok":"no"}" aria-live="polite">
      <span class="v">${q.opts[ans].r==="ok"?"Right size.":RLABEL[q.opts[ans].r]+"."}</span>${esc(q.opts[ans].why)}
      ${q.opts[ans].r==="ok"?"":`<p style="margin-top:6px">${esc(q.opts.find(o=>o.r==="ok").why)}</p>`}</div>`:""}
  </div>
  <div class="nav"><button class="btn ghost" data-go="1">Back</button><span class="spacer"></span>
    ${ans!==undefined?`<button class="btn" data-next="narrow">${i<NARROW.length-1?"Next topic":"Next"}</button>`:""}</div>`;
},

/* 3 bring it here */
() => {
  const i=S.bIdx, q=BRING[i], a1=S.bAff[i], a2=S.bExp[i];
  const part=(p,ans,key)=>`
    <p class="stem" style="font-size:17px;margin-top:16px">${esc(p.q)}</p>
    <div class="opts one">${p.opts.map((o,j)=>{
      let c=""; if(ans!==undefined){ c = j===p.a?"right":(j===ans?"wrong":"dim"); }
      return `<button class="opt ${c}" data-${key}="${j}" ${ans!==undefined?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>
    <div class="fb ${ans!==undefined?(ans===p.a?"ok show":"no show"):""}" aria-live="polite">${ans!==undefined?`<span class="v">${ans===p.a?"Yes.":"Not quite."}</span>${esc(p.why)}`:""}</div>`;
  return `
  <h2><span class="n">4</span>Bring it here</h2>
  <p>Take a big story. Find the person here it touches. Get <b>2 interviews: one person it affects and one person who knows the facts.</b></p>
  <div class="q" style="margin-top:14px">
    <div class="qn">Big story ${i+1} of ${BRING.length}</div>
    <p class="stem">${esc(q.big)} ${sayBtn(q.big)}</p>
    ${part(q.aff,a1,"aff")}
    ${a1!==undefined?part(q.exp,a2,"exp"):""}
  </div>
  <div class="nav"><button class="btn ghost" data-go="2">Back</button><span class="spacer"></span>
    ${a1!==undefined&&a2!==undefined?`<button class="btn" data-next="bring">${i<BRING.length-1?"Next story":"Next"}</button>`:""}</div>`;
},

/* 4 build it */
() => {
  const m=S.mine;
  return `
  <h2><span class="n">5</span>Build it · 5 steps</h2>
  <p>Turn one of your own topics into a story. These are the 5 steps on the Finding Stories handout.</p>
  <div class="stack" style="margin-top:14px">
    <div class="stepf"><span class="sn">1</span><div><label class="fld" for="topic">Name the topic.</label>
      <input class="inp" id="topic" maxlength="60" placeholder="Example: parking" value="${esc(m.topic)}"></div></div>
    <div class="stepf"><span class="sn">2</span><div><label class="fld" for="news">What is new or changing about it this week?</label>
      <input class="inp" id="news" maxlength="160" placeholder="Example: the back lot closes Monday" value="${esc(m.news)}"></div></div>
    <div class="stepf"><span class="sn">3</span><div><span class="fld">Find one person it affects and one person who can explain it.</span>
      <input class="inp" id="aff" maxlength="100" aria-label="One person it affects" placeholder="Affects: a junior with a parking permit" value="${esc(m.aff)}">
      <input class="inp" id="exp" maxlength="100" aria-label="One person who can explain it" placeholder="Explains: an assistant principal" value="${esc(m.exp)}" style="margin-top:8px"></div></div>
    <div class="stepf"><span class="sn">4</span><div><span class="fld">Write the focus sentence.</span>
      <div class="frame">
        <input class="inp" id="who" maxlength="60" aria-label="Who" placeholder="who (example: Juniors with permits)" value="${esc(m.who)}">
        <input class="inp" id="what" maxlength="120" aria-label="Is or are doing or facing what" placeholder="is/are doing or facing what" value="${esc(m.what)}">
        <span>, and students care because</span>
        <input class="inp" id="why" maxlength="120" aria-label="Why it matters now" placeholder="why it matters now" value="${esc(m.why)}">
      </div></div></div>
    <div class="stepf"><span class="sn">5</span><div><span class="fld">List 5 shots you can get this week. Shots with action, not people sitting.</span>
      ${m.shots.map((s,j)=>`<input class="inp shot" data-shot="${j}" maxlength="80" aria-label="Shot ${j+1}" placeholder="Shot ${j+1}" value="${esc(s)}" style="margin-top:${j?8:0}px">`).join("")}</div></div>
    <div id="meter"></div>
  </div>
  <div class="nav"><button class="btn ghost" data-go="3">Back</button><span class="spacer"></span><button class="btn" data-go="5">Finish</button></div>`;
},

/* 5 done */
() => {
  const n1=SORT.filter((q,i)=>S.sAns[i]===q.story).length;
  const n2=NARROW.filter((q,i)=>S.nAns[i]!==undefined&&q.opts[S.nAns[i]].r==="ok").length;
  const n3=BRING.reduce((a,q,i)=>a+(S.bAff[i]===q.aff.a?1:0)+(S.bExp[i]===q.exp.a?1:0),0);
  const tot=SORT.length+NARROW.length+BRING.length*2, got=n1+n2+n3;
  S.result={got,tot,when:S.result&&S.result.got===got?S.result.when:new Date()};
  return `
  <h2><span class="n">6</span>Done</h2>
  <div class="score"><span class="big">${got}/${tot}</span><span class="muted">first tries correct</span></div>
  <div class="stack" style="margin-top:16px">
    <div>
      <label class="fld" for="nm">Your name</label>
      <input class="inp" id="nm" maxlength="60" value="${esc(S.name)}" placeholder="First and last name">
    </div>
    <div class="passwrap">
      <img id="passImg" class="pass-img" alt="Your press pass">
      <button class="btn" id="dlPass" ${S.name.trim()?"":"disabled"}>${S.name.trim()?"Download press pass":"Type your name first"}</button>
      <a class="btn ghost" href="https://khspress.fillout.com/certificate-upload" target="_blank" rel="noopener" style="text-decoration:none">Submit press pass ↗</a>
      <p class="muted" style="text-align:center">Download it first, then upload the PNG on the submit form.</p>
    </div>
    ${hasDraft()?`<div class="box"><span class="tag">Your pitch draft</span>${draftHTML()}<button class="btn ghost" data-copy style="margin-top:10px;width:100%">Copy for Story Pitch</button></div>`:""}
    <div class="callout"><span class="tag">Remember</span>One sentence. A person, an action, and why students care now. Next, copy your draft into the Story Pitch – Template and post it on the Basecamp Idea Board.</div>
  </div>
  <div class="nav"><button class="btn ghost" data-restart>Try again</button><span class="spacer"></span><button class="btn ghost" data-go="4">Back</button></div>`;
}
];

function hasDraft(){ const m=S.mine; return !!(m.topic||m.who||m.what); }
function focusSentence(){ const m=S.mine; if(!m.who.trim()&&!m.what.trim()) return "";
  return `${m.who.trim()||"___"} ${m.what.trim()||"___"}, and students care because ${m.why.trim().replace(/^because\s+/i,"")||"___"}.`; }
function draftText(){
  const m=S.mine, shots=m.shots.filter(s=>s.trim());
  return [
    `Topic: ${m.topic||"—"}`,
    `What's new this week: ${m.news||"—"}`,
    `Focus sentence: ${focusSentence()||"—"}`,
    `Source it affects: ${m.aff||"—"}`,
    `Source who explains: ${m.exp||"—"}`,
    `Shot ideas: ${shots.length?shots.map((s,i)=>(i+1)+". "+s).join("  "):"—"}`
  ].join("\n");
}
function draftHTML(){ return `<div class="pitchline">${esc(draftText())}</div>`; }
function meter(){
  const el=document.getElementById("meter"); if(!el) return;
  const m=S.mine, shots=m.shots.filter(s=>s.trim()).length, sitting=m.shots.some(s=>/\b(sitting|sits|talking head|front of (the )?(building|school))\b/i.test(s));
  let cls="wait", msg;
  if(!m.topic.trim()) msg="Step 1: name the topic.";
  else if(!m.news.trim()) msg="Step 2: what is new or changing this week? No answer means no timeliness yet.";
  else if(!m.aff.trim()||!m.exp.trim()) msg="Step 3: name one person it affects and one person who can explain it.";
  else if(!m.who.trim()||!m.what.trim()||!m.why.trim()) msg="Step 4: fill all three blanks of the focus sentence.";
  else if(/^\s*\w+ing\b/i.test(m.what)) msg="Step 4: start the second blank with the action, like \"is\" or \"are\". Example: \"are hunting for new spots\".";
  else if(shots.length<5) msg=`Step 5: ${shots.length} of 5 shots. Can't think of 5? Keep narrowing.`;
  else if(sitting) msg="Step 5: swap out shots of people sitting or the front of a building. Find action.";
  else { cls="go"; msg="<b>It's a story.</b> Copy it into the Story Pitch – Template on the next screen."; }
  el.innerHTML=`<div class="meter ${cls}" aria-live="polite">${msg}</div>${focusSentence()?`<div class="pitchline"><b>Focus sentence:</b> ${esc(focusSentence())}</div>`:""}`;
}
function copyDraft(btn){
  const t=draftText(), done=()=>{ btn.textContent="Copied"; setTimeout(()=>btn.textContent="Copy for Story Pitch",1800); };
  try{ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(done,fallback); return; } }catch(e){}
  fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); done();}catch(e){} ta.remove(); }
}

/* ---------- press pass PNG ---------- */
const MODULE = {num:"03", title:"Find the Campus Angle", skill:"Topic to story in 5 steps"};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function track(c,t,x,y,sp,align){ // letter-spaced text
  const w=[...t].reduce((a,ch)=>a+c.measureText(ch).width+sp,-sp);
  let cx = align==="center"? x-w/2 : align==="right"? x-w : x;
  c.textAlign="left"; for(const ch of t){c.fillText(ch,cx,y);cx+=c.measureText(ch).width+sp;}
}
function passId(name,when,got){
  let h=2166136261; for(const ch of name+"|"+when.toISOString()+"|"+got+"|"+MODULE.num){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const s=(h>>>0).toString(36).toUpperCase().padStart(7,"0"); return s.slice(0,4)+"-"+s.slice(4,7);
}
let fontsReady=null;
function loadFonts(){
  if(!fontsReady){ fontsReady = (document.fonts? Promise.all(["900 40px Montserrat","800 40px Montserrat","700 40px Montserrat","400 40px Lexend","600 40px Lexend"].map(f=>document.fonts.load(f).catch(()=>{}))) : Promise.resolve()).then(()=>new Promise(r=>setTimeout(r,0))); }
  return fontsReady;
}
function drawPass(){
  const W=1080,H=1500,R=56, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const {got,tot,when}=S.result, name=(S.name.trim()||"Your name");
  const MS="Montserrat, Arial Black, sans-serif", LX="Lexend, Arial, sans-serif";
  // card
  rr(x,0,0,W,H,R); x.save(); x.clip();
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,0,560); g.addColorStop(0,"#6F1A1D"); g.addColorStop(.55,"#A61E1E"); g.addColorStop(1,"#DD2A2A");
  x.fillStyle=g; x.fillRect(0,0,W,560);
  // subtle diagonal stripes in band
  x.globalAlpha=.06; x.fillStyle="#fff"; for(let i=-600;i<W;i+=70){x.beginPath();x.moveTo(i,560);x.lineTo(i+560,0);x.lineTo(i+590,0);x.lineTo(i+30,560);x.fill();} x.globalAlpha=1;
  // footer
  x.fillStyle="#1E1E21"; x.fillRect(0,H-150,W,150);
  x.restore();
  // lanyard slot (punch out)
  x.save(); x.globalCompositeOperation="destination-out"; rr(x,W/2-110,46,220,38,19); x.fill(); x.restore();
  // band text
  x.fillStyle="#fff"; x.globalAlpha=.9; x.font=`700 30px ${MS}`; track(x,"KHS COUGAR NEWS",W/2,150,9,"center"); x.globalAlpha=1;
  x.font=`900 200px ${MS}`; x.textAlign="center";
  x.fillStyle="rgba(60,20,20,.55)"; x.fillText("PRESS",W/2+6,346); x.fillText("PASS",W/2+6,516);
  x.fillStyle="#fff"; x.fillText("PRESS",W/2,340); x.fillText("PASS",W/2,510);
  // body
  const L=90;
  x.fillStyle="#4A4A50"; x.font=`800 28px ${MS}`; track(x,"ISSUED TO",L,650,6);
  let fs=96; x.font=`800 ${fs}px ${MS}`; while(x.measureText(name.toUpperCase()).width>W-2*L && fs>40){fs-=4; x.font=`800 ${fs}px ${MS}`;}
  x.fillStyle="#1E1E21"; x.textAlign="left"; x.fillText(name.toUpperCase(),L,650+20+fs*.85);
  x.fillStyle="#E6DCDA"; x.fillRect(L,800,W-2*L,4);
  x.fillStyle="#4A4A50"; x.font=`800 28px ${MS}`; track(x,"CLEARED IN · MICRO-LESSON "+MODULE.num,L,872,6);
  x.fillStyle="#6F1A1D"; x.font=`800 62px ${MS}`; x.fillText(MODULE.title.toUpperCase(),L,948);
  x.fillStyle="#4A4A50"; x.font=`400 34px ${LX}`; x.fillText(MODULE.skill,L,1002);
  // score + date
  x.fillStyle="#4A4A50"; x.font=`800 28px ${MS}`; track(x,"SCORE",L,1100,6); track(x,"DATE",430,1100,6);
  x.fillStyle="#B3201F"; x.font=`900 92px ${MS}`; x.fillText(`${got}/${tot}`,L,1195);
  x.fillStyle="#1E1E21"; x.font=`800 50px ${MS}`; x.fillText(when.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),430,1185);
  x.fillStyle="#4A4A50"; x.font=`400 30px ${LX}`; x.fillText(when.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),430,1232);
  // stamp
  x.save(); x.translate(905,1160); x.rotate(-.2); x.strokeStyle="#B3201F"; x.fillStyle="#B3201F"; x.globalAlpha=.9;
  x.lineWidth=7; x.beginPath(); x.arc(0,0,105,0,Math.PI*2); x.stroke(); x.lineWidth=3; x.beginPath(); x.arc(0,0,88,0,Math.PI*2); x.stroke();
  x.font=`900 34px ${MS}`; x.textAlign="center"; x.fillText("ON",0,-14); x.fillText("AIR",0,26); x.font=`800 16px ${MS}`; x.fillText("★ CLEARED ★",0,58); x.restore();
  // footer text
  x.textAlign="left"; x.fillStyle="#DD2A2A"; x.font=`900 72px ${MS}`; x.fillText(MODULE.num,L,H-50);
  x.fillStyle="#fff"; x.font=`700 26px ${MS}`; track(x,"KHS COUGAR NEWS · MICRO-LEARNING",L+120,H-84,4);
  x.globalAlpha=.7; x.font=`600 24px ${MS}`; track(x,"PASS ID "+passId(name,when,got),L+120,H-48,4); x.globalAlpha=1;
  return c;
}
function updatePass(){
  const img=document.getElementById("passImg"); if(!img) return;
  loadFonts().then(()=>{ try{ img.src=drawPass().toDataURL("image/png"); }catch(e){} });
}
function downloadPass(){
  loadFonts().then(()=>{
    const c=drawPass(), slug=(S.name.trim()||"student").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"");
    const fn=`Press-Pass-${MODULE.num}-${slug}.png`;
    c.toBlob(b=>{
      if(!b) return;
      const url=URL.createObjectURL(b), a=document.createElement("a");
      a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    },"image/png");
  });
}

function render(){
  renderProg();
  app.innerHTML = screens[S.step]();
  if(S.step===4) meter();
  if(S.step===5) updatePass();
}

/* ---------- events ---------- */
app.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.say!==undefined){ speak(t.dataset.say); return; }
  if(t.id==="dlPass"){ downloadPass(); return; }
  if(t.hasAttribute("data-copy")){ copyDraft(t); return; }
  if(t.dataset.go!==undefined){ go(+t.dataset.go); return; }
  if(t.dataset.sort){ S.sAns[S.sIdx]=t.dataset.sort==="true"; render(); return; }
  if(t.dataset.narrow){ S.nAns[S.nIdx]=+t.dataset.narrow; render(); return; }
  if(t.dataset.aff){ S.bAff[S.bIdx]=+t.dataset.aff; render(); return; }
  if(t.dataset.exp){ S.bExp[S.bIdx]=+t.dataset.exp; render(); return; }
  if(t.dataset.next==="sort"){ if(S.sIdx<SORT.length-1){S.sIdx++; render(); app.focus();} else go(2); return; }
  if(t.dataset.next==="narrow"){ if(S.nIdx<NARROW.length-1){S.nIdx++; render(); app.focus();} else go(3); return; }
  if(t.dataset.next==="bring"){ if(S.bIdx<BRING.length-1){S.bIdx++; render(); window.scrollTo({top:0}); app.focus();} else go(4); return; }
  if(t.hasAttribute("data-restart")){ S.sIdx=0; S.sAns=[]; S.nIdx=0; S.nAns=[]; S.bIdx=0; S.bAff=[]; S.bExp=[]; S.result=null; go(0); }
});
app.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.lang!==undefined){ S.lang[t.dataset.lang]=t.value; save(); return; }
  if(t.dataset.shot!==undefined){ S.mine.shots[+t.dataset.shot]=t.value; meter(); return; }
  if(["topic","news","aff","exp","who","what","why"].includes(t.id)){ S.mine[t.id]=t.value; meter(); return; }
  if(t.id==="nm"){ S.name=t.value; save(); const b=document.getElementById("dlPass"); if(b){ const ok=!!t.value.trim(); b.disabled=!ok; b.textContent=ok?"Download press pass":"Type your name first"; }
    clearTimeout(S._pt); S._pt=setTimeout(updatePass,200); }
});

render();
})();
</script>
</body>
</html>
